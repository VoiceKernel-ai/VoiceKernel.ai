services:
  postgres:
    image: postgres:16-alpine
    container_name: voicekernel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: voicekernel
      POSTGRES_PASSWORD: voicekernel
      POSTGRES_DB: voicekernel
    ports:
      - "55432:5432"
    volumes:
      - voicekernel-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicekernel -d voicekernel"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    container_name: voicekernel-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgres://voicekernel:voicekernel@postgres:5432/voicekernel
      JWT_SECRET: ${JWT_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      PROVIDER_API_KEY: ${PROVIDER_API_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    ports:
      - "8080:8080"
    profiles: ["full"]

volumes:
  voicekernel-pgdata:
